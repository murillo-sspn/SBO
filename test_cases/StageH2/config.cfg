[general_info]
# Define problem type
problem = online_SBO
parametrization = rotor_and_diffuser_blades
r2 = 0.121662
b2 = 0.009724

# Filenames of datasets for training and validation
dataset_training = Training.csv
dataset_validation = Validation.csv

# Independent variables (inputs)
var_independent = rotor_hub_midstream_angle, rotor_shroud_midstream_angle, rotor_hub_wrap_perturbation, rotor_TE_rake_angle, diffuser_midstream_angle, diffuser_wrap_perturbation, diffuser_tn2, diffuser_tn3

# Continuous dependent variables (outputs)
var_dependent = Eff_Isentropic_Vanes_TE, Ratio_p0_Vanes_TE

# Binary dependent variables (outputs)
var_dependent_binary = Convergence

# Models
surrogate_models = nn
surrogate_models_binary = rf, svm, svm, svm

# Validation of the metamodels: holdout (validation data only) | cross_validation (k-fold, training + validation data)
# score: R² (continuous) and balanced accuracy (binary)
validation = cross_validation
validation_binary = cross_validation
cv_folds = 5

# Retune hyperparameters while R² < r2_min, at most max_retune_attempts times
r2_min = 0.8
max_retune_attempts = 1

[neural_networks]
# Model settings (same number and order of outputs)
scale_Xy = True, True
nn_opt_hyperparameters = False, False
nn_hidden_layers = [[3, 12, 11], [11, 5]]
nn_activation = tanh, tanh
nn_solver = adam, adam
nn_max_iter = 5000, 5000
nn_random_seed = 42, 42
nn_tol = 1e-5, 1e-5
nn_learning_rate_init = 1e-3, 1e-3


# Optimization
nn_opt_layers_min=2
nn_opt_layers_max=4
nn_opt_n_neurons_min=2
nn_opt_n_neurons_max=15
nn_opt_activation = relu, tanh, logistic
nn_opt_pop_size=10
nn_opt_n_gen=10
nn_opt_prob_cross=0.8
nn_opt_prob_mut=0.8
# Objective of the hyperparameter optimization: r2 (minimizes |1 - R2|) | max_error (maximum absolute error)
# | p95_error (95th percentile of the absolute error: 95% of the points have a smaller error)
# computed with the validation of [general_info] (holdout or cross_validation); all are printed
nn_opt_metric = r2

[support_vector_machine]
svm_model = _, SVC, NuSVC, LinearSVC

[random_forest]
# Number of trees, minimum number of points per leaf (> 1 reduces memorization)
rf_n_estimators = 500
rf_min_samples_leaf = 3
# balanced: compensates for fewer diverged than converged points | none
rf_class_weight = balanced

[optimization]
# Flag
opt_flag = True
# Optimization method
opt_method = nsga2
# Objective
opt_obj = Eff_Isentropic_Vanes_TE
opt_min_max = max
# Constraints
opt_constraints = Convergence, Ratio_p0_Vanes_TE
# Convergence above 1: classifier must predict 1 (with baseline 0 the constraint is never active)
opt_constraints_baseline = 1, 1.19547
opt_constraints_above_below_baseline = above, above

[nsga2]
opt_nsga2_pop_size = 200
opt_nsga2_n_gen = 250
opt_nsga2_prob_cross = 0.7
opt_nsga2_prob_mut = 0.7

[dvs_cfd_baseline]
Rotor.Hub.Theta.3y = 42.179032933689221
Rotor.Hub.Theta.4y = 59.51942871598505
Rotor.Hub.Theta.5y = 75.307853718610019
Rotor.Shroud.Theta.3y = 41.227693810654
Rotor.Shroud.Theta.4y = 65.313750898143056
Rotor.Shroud.Theta.5y = 75.307853718610019
Diffuser.Theta.3y = 17.259150366946276
Diffuser.Theta.4y = 24.718946267990567
Diffuser.Theta.5y = 32.0602544970018
Diffuser.Thickness.2y = 0.00921068
Diffuser.Thickness.3y = 0.00652414

[dvs_doe_baseline_and_ranges]
rotor_hub_midstream_angle = Rotor.Hub.Theta.3y,-2.5, 2.5
rotor_shroud_midstream_angle =  Rotor.Shroud.Theta.3y,-2.5, 2.5
rotor_hub_wrap_perturbation = 0,-2.5, 2.0
rotor_TE_rake_angle = 0,-25, 0
diffuser_midstream_angle = Diffuser.Theta.3y,-2.5, 0.75
diffuser_wrap_perturbation = 0,-0.75, 2.5
diffuser_tn2 = Diffuser.Thickness.2y,-0.001, 0.0007
diffuser_tn3 = Diffuser.Thickness.3y,-0.001, 0.001

#-----------------------------------------------------#
# Online SBO
#   (no inline comments: values are parsed up to the end of the line)
#-----------------------------------------------------#

[online]
# Number of generations GEN_0000 ... GEN_<max_generations-1>
max_generations = 10
# Model selection every selection_every generations (GEN_0000 always); otherwise models.cfg of the previous generation
selection_every = 5
# Optimum at a bound if closer than bound_tolerance * range width
bound_tolerance = 0.01
# Metrics of the metamodels reported for the n_local points closest to the optimum (cross-validation predictions)
n_local = 15
# Row of the training data (0 = first) with the baseline design (plots)
baseline_index = 0
# Strategies: infill = surrogate_optimum; range_update = expand_at_bounds | fixed
infill = surrogate_optimum
range_update = expand_at_bounds

[plots]
# Monitors: other quantities of the datasets / [workbench_outputs] plotted like the objective (OPT/Plots/monitor-*)
monitors = Eff_Isentropic_Rotor_TE, Component_1_Alpha_te, Component_2_Beta_le, Diffuser_Cp, Power, S_Gen

[dvs_doe_range_expansion]
# variable = expansion (% of current width), hard delta min, hard delta max
# hard limits are relative to the baseline (as in dvs_doe_baseline_and_ranges), none = no limit
# variables not listed keep a fixed range
# TODO: review the values below (placeholders)
rotor_hub_midstream_angle = 20, -7.5, 7.5
rotor_shroud_midstream_angle = 20, -7.5, 7.5
rotor_hub_wrap_perturbation = 20, -7.5, 6.0
rotor_TE_rake_angle = 20, -25, 10
diffuser_midstream_angle = 20, -7.5, 2.25
diffuser_wrap_perturbation = 20, -2.25, 7.5
diffuser_tn2 = 20, -0.001, 0.002
diffuser_tn3 = 20, -0.001, 0.003

[workbench]
# Base project (relative to this file or absolute)
template_project = ./reference.wbpj
# copy_new_dp:    copy of the base project in each OPT/GEN_XXXX/CFD, new design point
# copy_modify_dp: copy of the base project in each OPT/GEN_XXXX/CFD, base design point modified
# base_new_dp:    all design points added to the base project itself (template_project is modified)
# shared_new_dp:  base project copied once to OPT/Workbench, all design points added to this copy
# copy_new_dp | copy_modify_dp | base_new_dp | shared_new_dp
mode = shared_new_dp
base_design_point = 1
release = 19.2
script_version = 19.2.120
wb_exe = C:\Program Files\ANSYS Inc\v192\Framework\bin\Win64\runwb2.exe
cfx_system = CFX
# Timeout of one CFD run (s)
timeout_s = 43200
# Workbench is stopped if the solver does not start (no .out file) within this time (s): geometry/mesh failure
solver_start_timeout_s = 7200
retain_solution = true
# false: only writes the journal of the next CFD run and stops
run_workbench = true
# true: debugger breakpoint after writing the journal, immediately before running CFX
breakpoint_before_cfd = false

